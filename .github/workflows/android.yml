name: Build Android APK

on:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --no-audit

      - name: Build Web App with Parcel
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npm run build -- --no-cache

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "zulu"

      - name: Install Capacitor CLI & Assets Tool
        run: npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

      - name: Create Android Project
        run: |
          npx cap init "Xeon Configurator" "com.renkohub.xeontest" --web-dir=dist
          npx cap add android

      # Робот сам создаст нужную структуру папок и сгенерирует иконку на сервере
      - name: Generate Android Icons Automatically
        run: |
          mkdir -p assets
          cp icon.png assets/icon-only.png
          npx capacitor-assets generate --android --asset-path assets

      - name: Fix Kotlin Duplicate Classes Conflict
        run: |
          echo "configurations.all {
              resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                  if (details.requested.group == 'org.jetbrains.kotlin') {
                      details.useVersion '1.9.22'
                  }
              }
          }" >> android/build.gradle

      - name: Sync Capacitor with Android
        run: npx cap sync

      - name: Build Android APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: xeon-app-package
          path: android/app/build/outputs/apk/debug/app-debug.apk
