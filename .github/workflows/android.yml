name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install Dependencies
        run: npm install --no-audit

      - name: Build Web App with Parcel
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npm run build -- --no-cache

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Install Capacitor CLI
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Android Project
        run: |
          npx cap init "Xeon Configurator" "com.renkohub.xeontest" --web-dir=dist
          npx cap add android

      # Внедряем иконку напрямую в ресурсы
      - name: Inject Custom Android Icon Directly
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp icon.png android/app/src/main/res/drawable/ic_launcher.png
          sed -i 's/android:icon="@mipmap\/ic_launcher"/android:icon="@drawable\/ic_launcher"/g' android/app/src/main/AndroidManifest.xml

      # Смертельный удар по дубликатам Kotlin во ВСЕХ модулях приложения
      - name: Enforce Kotlin BOM to Kill Duplicate Classes
        run: |
          sed -i '/dependencies {/a \    implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.9.22"))' android/app/build.gradle

      - name: Sync Capacitor with Android
        run: npx cap sync

      - name: Build Android APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: xeon-app-package
          path: android/app/build/outputs/apk/debug/app-debug.apk
